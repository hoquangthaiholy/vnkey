name: Release macOS

# Dựng VNKey (Swift Package), ký bằng Developer ID, công chứng với Apple rồi đính tệp vào bản phát hành.
# Chạy khi một bản phát hành được công bố trên GitHub, hoặc chạy tay với một thẻ có sẵn.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Thẻ phiên bản cần dựng (vd 2.0.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"

      - name: Show toolchain
        run: |
          swift --version
          sw_vers

      - name: Run tests
        run: swift test

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Resolve signing identity
        run: |
          IDENTITY=$(security find-identity -v -p codesigning | grep -m1 "Developer ID Application" | sed -E 's/^[^"]*"([^"]*)".*$/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in keychain" >&2
            security find-identity -v -p codesigning >&2 || true
            exit 1
          fi
          echo "Using signing identity: $IDENTITY"
          echo "VNKEY_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # Hai biến thể: "universal" (Apple silicon + Intel) và "arm64" (chỉ Apple silicon, nhẹ hơn).
      # Mỗi biến thể được dựng, ký, công chứng, ghim phiếu công chứng rồi đóng thành ZIP và DMG.
      - name: Build, sign, notarize, package
        env:
          VNKEY_VERSION: ${{ steps.version.outputs.version }}
          VNKEY_BUILD: ${{ github.run_number }}
          VNKEY_BUNDLE_ID: com.hoquangthaiholy.vnkey
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for VARIANT in universal arm64; do
            echo "::group::Build $VARIANT"
            if [ "$VARIANT" = "universal" ]; then export VNKEY_UNIVERSAL=1; else export VNKEY_UNIVERSAL=0; fi
            ./Scripts/build-app.sh
            codesign --verify --strict --verbose=2 build/VNKey.app
            ARCHS=$(lipo -archs build/VNKey.app/Contents/MacOS/VNKey)
            echo "Architectures: $ARCHS"
            if [ "$VARIANT" = "arm64" ] && [ "$ARCHS" != "arm64" ]; then
              echo "::error::arm64 build contains: $ARCHS" >&2; exit 1
            fi
            echo "::endgroup::"

            echo "::group::Notarize $VARIANT"
            ditto -c -k --keepParent build/VNKey.app build/notarize.zip
            xcrun notarytool submit build/notarize.zip \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple build/VNKey.app
            rm build/notarize.zip
            echo "::endgroup::"

            NAME="VNKey_${VNKEY_VERSION}_${VARIANT}"
            ditto -c -k --keepParent build/VNKey.app "dist/$NAME.zip"
            rm -rf build/dmg && mkdir -p build/dmg
            cp -R build/VNKey.app build/dmg/
            ln -s /Applications build/dmg/Applications
            hdiutil create -volname "VNKey ${VNKEY_VERSION}" -srcfolder build/dmg -ov -format UDZO "dist/$NAME.dmg"
            codesign --force --timestamp --sign "$VNKEY_SIGN_IDENTITY" "dist/$NAME.dmg"
          done
          ls -l dist

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.version.outputs.tag }}" dist/*.dmg dist/*.zip --clobber
